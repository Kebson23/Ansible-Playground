server {
    listen 80;
    server_name localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }

    # Proxy to Ansible Server (requires shellinabox running with --disable-ssl)
    location /ansible/ {
        # The hostname "server-ansible" must match the service name in docker-compose
        proxy_pass http://server-ansible:4200/;
        
        # Standard proxy headers for Shellinabox and IP forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # WebSocket support (essential for smooth terminal performance)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Disable buffering to ensure real-time terminal output
        proxy_buffering off;
    }

    # Proxy to Client Node 1
    location /client/ {
        proxy_pass http://ansible-node1:4200/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # WebSocket and Real-time streaming configuration
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    # Proxy to Client Node 2
    location /client2/ {
        proxy_pass http://ansible-node2:4200/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # WebSocket and Real-time streaming configuration
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}
server {
    listen 80;
    server_name localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }

    # Proxy do Ansible Server (wymaga shellinabox w trybie --disable-ssl)
    location /ansible/ {
        # Nazwa hosta "ansible-node" musi pasować do nazwy usługi w docker-compose
        proxy_pass http://server-ansible:4200/;
        
        # Nagłówki wymagane przez Shellinabox i WebSocket
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Obsługa WebSocket (płynne działanie terminala)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Wyłączenie buforowania (ważne dla terminala)
        proxy_buffering off;
    }

    # Proxy do Klienta
    location /client/ {
        proxy_pass http://ansible-node1:4200/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}
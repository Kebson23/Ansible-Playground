- name: Update packages depending on OS family
  hosts: all

  tasks:
    - name: Update packages on Debian Family
      apt: 
        update_cache:  true
        upgrade: safe 
      when: ansible_facts.os_family == "Debian"
    - name: Check if microdnf exists
      ansible.builtin.command: command -v microdnf
      register: has_microdnf
      changed_when: false
      failed_when: false
      when: ansible_facts.os_family == "RedHat"

    - name: Update using microdnf
      ansible.builtin.command: microdnf -y update
      register: microdnf_out
      changed_when: "'Nothing to do.' not in microdnf_out.stdout"
      when:
        - ansible_facts.os_family == "RedHat"
        - has_microdnf.rc == 0

    - name: Update using package module (dnf/yum)
      ansible.builtin.package:
        name: "*"
        state: latest
      when:
        - ansible_facts.os_family == "RedHat"
        - has_microdnf.rc != 0
    
      